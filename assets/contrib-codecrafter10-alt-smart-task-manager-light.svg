<svg xmlns="http://www.w3.org/2000/svg" width="410" height="132" viewBox="0 0 410 132">
<style>
.bg{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.fg{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#656d76;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#8c959f;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.edge{fill:none;stroke:#1f2328;stroke-width:1.2;stroke-dasharray:1100;stroke-dashoffset:1100;opacity:.55;animation:draw 1.8s cubic-bezier(.6,0,.2,1) 0.00s forwards, fade-out 1.2s ease 1.90s forwards}
@keyframes fade-out{to{opacity:0}}
.tag{fill:none;stroke:#d0d7de}
.arrow{stroke:#656d76;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ico{stroke:#656d76;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dotfill{fill:#656d76}

</style>
<rect class="card" x=".5" y=".5" width="409" height="131" rx="12"/>
<rect class="edge" x=".5" y=".5" width="409" height="131" rx="12"/>
<text x="24" y="38" class="fg r" font-size="17" font-weight="600" style="animation-delay:0.20s"><tspan class="mute" font-weight="400">codeCrafter10-alt / </tspan>smart-task-manager</text>
<g class="r" style="animation-delay:0.30s"><path class="arrow" d="M376 26 l8 8 l-8 8 M368 34 h15"/></g>
<text x="24" y="62" class="mute r" font-size="13" style="animation-delay:0.40s">Clean and minimal task manager with support</text>
<text x="24" y="80" class="mute r" font-size="13" style="animation-delay:0.48s">for descriptions, due dates, and a smooth UI...</text>
<g class="f" style="animation-delay:0.70s"><rect class="tag" x="24" y="96" width="90" height="20" rx="10"/><text x="33" y="110" class="faint" font-size="11">javascript</text></g>
<g class="f" style="animation-delay:0.80s"><g class="ico" transform="translate(366.8,106)"><circle r="5.8"/><circle class="dotfill" r="1.3" stroke="none"/></g><text x="378.8" y="110.5" class="mute mono" font-size="12">1</text></g><g class="f" style="animation-delay:0.88s"><g class="ico" transform="translate(325.6,106)"><path d="M0.00 -6.20 L1.59 -2.18 L5.90 -1.92 L2.57 0.83 L3.64 5.02 L0.00 2.70 L-3.64 5.02 L-2.57 0.83 L-5.90 -1.92 L-1.59 -2.18Z"/></g><text x="337.6" y="110.5" class="mute mono" font-size="12">0</text></g>
</svg>