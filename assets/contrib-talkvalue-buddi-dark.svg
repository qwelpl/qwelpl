<svg xmlns="http://www.w3.org/2000/svg" width="410" height="132" viewBox="0 0 410 132">
<style>
.bg{fill:#0d1117}
.card{fill:#11161d;stroke:#262c36;stroke-width:1}
.fg{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#8b949e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#6e7681;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.edge{fill:none;stroke:#e6edf3;stroke-width:1.2;stroke-dasharray:1100;stroke-dashoffset:1100;opacity:.55;animation:draw 1.8s cubic-bezier(.6,0,.2,1) 0.00s forwards, fade-out 1.2s ease 1.90s forwards}
@keyframes fade-out{to{opacity:0}}
.tag{fill:none;stroke:#262c36}
.arrow{stroke:#8b949e;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ico{stroke:#8b949e;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dotfill{fill:#8b949e}

</style>
<rect class="card" x=".5" y=".5" width="409" height="131" rx="12"/>
<rect class="edge" x=".5" y=".5" width="409" height="131" rx="12"/>
<text x="24" y="38" class="fg r" font-size="17" font-weight="600" style="animation-delay:0.20s"><tspan class="mute" font-weight="400">talkvalue / </tspan>Buddi</text>
<g class="r" style="animation-delay:0.30s"><path class="arrow" d="M376 26 l8 8 l-8 8 M368 34 h15"/></g>
<text x="24" y="62" class="mute r" font-size="13" style="animation-delay:0.40s">A macOS notch companion for Claude Code — your</text>
<text x="24" y="80" class="mute r" font-size="13" style="animation-delay:0.48s">buddy lives here now.</text>
<g class="f" style="animation-delay:0.70s"><rect class="tag" x="24" y="96" width="54" height="20" rx="10"/><text x="33" y="110" class="faint" font-size="11">swift</text></g>
<g class="f" style="animation-delay:0.80s"><g class="ico" transform="translate(366.8,106)"><circle cx="-3.5" cy="-4.5" r="1.7"/><circle cx="-3.5" cy="4.5" r="1.7"/><path d="M-3.5 -2.8v5.6"/><circle cx="3.5" cy="4.5" r="1.7"/><path d="M3.5 2.8V-1.5a2 2 0 0 0-2-2H-.5M1 -5.5l-2 2 2 2"/></g><text x="378.8" y="110.5" class="mute mono" font-size="12">1</text></g><g class="f" style="animation-delay:0.88s"><g class="ico" transform="translate(318.4,106)"><path d="M0.00 -6.20 L1.59 -2.18 L5.90 -1.92 L2.57 0.83 L3.64 5.02 L0.00 2.70 L-3.64 5.02 L-2.57 0.83 L-5.90 -1.92 L-1.59 -2.18Z"/></g><text x="330.4" y="110.5" class="mute mono" font-size="12">92</text></g>
</svg>