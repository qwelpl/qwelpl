<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220">
<style>
.bg{fill:#0d1117}
.card{fill:#11161d;stroke:#262c36;stroke-width:1}
.fg{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#8b949e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#6e7681;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

@keyframes again{0%{opacity:1;transform:translateY(0)}2%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
.ico{stroke:#8b949e;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dotfill{fill:#8b949e}
.sep{stroke:#262c36;stroke-width:1}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
@keyframes up{to{transform:scaleY(1)}}
@keyframes reup{0%{transform:scaleY(1)}3%{transform:scaleY(0)}9%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.track{fill:none;stroke:#262c36;stroke-width:6}
.arc{fill:none;stroke:#e6edf3;stroke-width:6;stroke-linecap:round;stroke-dasharray:289.0;stroke-dashoffset:289.0}
@keyframes fill{to{stroke-dashoffset:214.4}}
@keyframes refill{0%{stroke-dashoffset:214.4}3%{stroke-dashoffset:289.0}12%{stroke-dashoffset:214.4}100%{stroke-dashoffset:214.4}}

</style>
