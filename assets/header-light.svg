<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220">
<style>
.bg{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.fg{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#656d76;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#8c959f;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.word{font-size:22px;font-weight:500;opacity:0;animation:cyc 12s ease-in-out infinite}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3.00%{opacity:1;transform:translateY(0)}22.00%{opacity:1;transform:translateY(0)}25.00%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.ln{stroke:#d0d7de;stroke-width:1;stroke-dasharray:840;stroke-dashoffset:840;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .3s forwards}
.dot{fill:#8c959f;opacity:.0;animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05}50%{opacity:.35}}
.cursor{fill:#1f2328;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

</style>
