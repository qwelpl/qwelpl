<svg xmlns="http://www.w3.org/2000/svg" width="840" height="184" viewBox="0 0 840 184">
<style>
.bg{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.fg{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#656d76;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#8c959f;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.word{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:22px;opacity:0;animation:cyc 12s ease-in-out infinite}
.ghost{fill:transparent}
.hl{fill:#1f2328;font-weight:500}
@keyframes cyc{0%{opacity:0}3.75%{opacity:1}21.25%{opacity:1}25.00%{opacity:0}100%{opacity:0}}
.ln{stroke:#d0d7de;stroke-width:1;stroke-dasharray:840;stroke-dashoffset:840;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .4s forwards}

</style>
<text x="0" y="28" class="mute r" font-size="16">hey there, i'm</text>
<text x="-3" y="98" class="fg r" font-size="72" font-weight="700" letter-spacing="-2.5" style="animation-delay:.12s">aarav</text>
<text x="0" y="146" class="mute f" font-size="22" style="animation-delay:.9s">i build</text>
<text x="0" y="146" class="word" style="animation-delay:1.4s"><tspan class="ghost">i build </tspan><tspan class="hl">macOS apps</tspan></text><text x="0" y="146" class="word" style="animation-delay:4.4s"><tspan class="ghost">i build </tspan><tspan class="hl">web tools</tspan></text><text x="0" y="146" class="word" style="animation-delay:7.4s"><tspan class="ghost">i build </tspan><tspan class="hl">word games</tspan></text><text x="0" y="146" class="word" style="animation-delay:10.4s"><tspan class="ghost">i build </tspan><tspan class="hl">dev utilities</tspan></text>
<line class="ln" x1="0" y1="174" x2="840" y2="174"/>
</svg>