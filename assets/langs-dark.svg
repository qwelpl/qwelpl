<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
<style>
.bg{fill:#0d1117}
.card{fill:#11161d;stroke:#262c36;stroke-width:1}
.fg{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#8b949e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#6e7681;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.seg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}

</style>
<rect class="card" x=".5" y=".5" width="839" height="95" rx="12"/>
<clipPath id="c"><rect x="24" y="28" width="792" height="8" rx="4"/></clipPath>
<g clip-path="url(#c)"><rect class="seg" x="24.00" y="28" width="253.12" height="8" rx="2" fill="#e6edf3" style="animation-delay:0.10s"/><rect class="seg" x="279.12" y="28" width="190.24" height="8" rx="2" fill="#adbac7" style="animation-delay:0.22s"/><rect class="seg" x="471.36" y="28" width="109.34" height="8" rx="2" fill="#768390" style="animation-delay:0.34s"/><rect class="seg" x="582.69" y="28" width="60.35" height="8" rx="2" fill="#545d68" style="animation-delay:0.46s"/><rect class="seg" x="645.04" y="28" width="60.22" height="8" rx="2" fill="#373e47" style="animation-delay:0.58s"/><rect class="seg" x="707.26" y="28" width="106.74" height="8" rx="2" fill="#2d333b" style="animation-delay:0.70s"/></g>
<g class="r" style="animation-delay:0.60s"><circle cx="29" cy="70" r="4" fill="#e6edf3" stroke="#262c36"/><text x="40" y="74" class="mute" font-size="12">python  32.2%</text></g><g class="r" style="animation-delay:0.68s"><circle cx="154.8" cy="70" r="4" fill="#adbac7" stroke="#262c36"/><text x="165.8" y="74" class="mute" font-size="12">swift  24.3%</text></g><g class="r" style="animation-delay:0.76s"><circle cx="274.0" cy="70" r="4" fill="#768390" stroke="#262c36"/><text x="285.0" y="74" class="mute" font-size="12">typescript  14.1%</text></g><g class="r" style="animation-delay:0.84s"><circle cx="426.2" cy="70" r="4" fill="#545d68" stroke="#262c36"/><text x="437.2" y="74" class="mute" font-size="12">jupyter notebook  7.9%</text></g><g class="r" style="animation-delay:0.92s"><circle cx="611.4" cy="70" r="4" fill="#373e47" stroke="#262c36"/><text x="622.4" y="74" class="mute" font-size="12">html  7.9%</text></g><g class="r" style="animation-delay:1.00s"><circle cx="717.4" cy="70" r="4" fill="#2d333b" stroke="#262c36"/><text x="728.4" y="74" class="mute" font-size="12">other  13.7%</text></g>
</svg>