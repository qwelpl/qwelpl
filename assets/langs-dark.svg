<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
<style>
.bg{fill:#0d1117}
.card{fill:#11161d;stroke:#262c36;stroke-width:1}
.fg{fill:#e6edf3;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#8b949e;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#6e7681;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.seg{transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes regrow{0%{transform:scaleX(1)}3%{transform:scaleX(0)}9%{transform:scaleX(1)}100%{transform:scaleX(1)}}

</style>
<rect class="card" x=".5" y=".5" width="839" height="95" rx="12"/>
<clipPath id="c"><rect x="24" y="28" width="792" height="8" rx="4"/></clipPath>
<g clip-path="url(#c)"><rect class="seg" x="24.00" y="28" width="291.03" height="8" rx="2" fill="#e6edf3" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.10s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.10s infinite"/><rect class="seg" x="317.03" y="28" width="184.69" height="8" rx="2" fill="#adbac7" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.22s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.22s infinite"/><rect class="seg" x="503.72" y="28" width="138.80" height="8" rx="2" fill="#768390" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.34s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.34s infinite"/><rect class="seg" x="644.52" y="28" width="79.92" height="8" rx="2" fill="#545d68" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.46s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.46s infinite"/><rect class="seg" x="726.44" y="28" width="34.53" height="8" rx="2" fill="#373e47" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.58s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.58s infinite"/><rect class="seg" x="762.97" y="28" width="51.03" height="8" rx="2" fill="#2d333b" style="animation:grow 1s cubic-bezier(.6,0,.2,1) 0.70s forwards,regrow 14s cubic-bezier(.4,0,.2,1) 4.70s infinite"/></g>
<g class="r" style="animation-delay:0.60s"><circle cx="29" cy="70" r="4" fill="#e6edf3" stroke="#262c36"/><text x="40" y="74" class="mute" font-size="12">swift  37.0%</text></g><g class="r" style="animation-delay:0.68s"><circle cx="148.2" cy="70" r="4" fill="#adbac7" stroke="#262c36"/><text x="159.2" y="74" class="mute" font-size="12">typescript  23.6%</text></g><g class="r" style="animation-delay:0.76s"><circle cx="300.4" cy="70" r="4" fill="#768390" stroke="#262c36"/><text x="311.4" y="74" class="mute" font-size="12">python  17.8%</text></g><g class="r" style="animation-delay:0.84s"><circle cx="426.2" cy="70" r="4" fill="#545d68" stroke="#262c36"/><text x="437.2" y="74" class="mute" font-size="12">javascript  10.3%</text></g><g class="r" style="animation-delay:0.92s"><circle cx="578.4" cy="70" r="4" fill="#373e47" stroke="#262c36"/><text x="589.4" y="74" class="mute" font-size="12">css  4.6%</text></g><g class="r" style="animation-delay:1.00s"><circle cx="677.8" cy="70" r="4" fill="#2d333b" stroke="#262c36"/><text x="688.8" y="74" class="mute" font-size="12">other  6.7%</text></g>
</svg>