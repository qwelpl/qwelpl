<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96">
<style>
.bg{fill:#ffffff}
.card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.fg{fill:#1f2328;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mute{fill:#656d76;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
.faint{fill:#8c959f;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1s ease forwards}

.seg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}

</style>
<rect class="card" x=".5" y=".5" width="839" height="95" rx="12"/>
<clipPath id="c"><rect x="24" y="28" width="792" height="8" rx="4"/></clipPath>
<g clip-path="url(#c)"><rect class="seg" x="24.00" y="28" width="289.44" height="8" rx="2" fill="#24292f" style="animation-delay:0.10s"/><rect class="seg" x="315.44" y="28" width="185.30" height="8" rx="2" fill="#57606a" style="animation-delay:0.22s"/><rect class="seg" x="502.74" y="28" width="139.26" height="8" rx="2" fill="#8c959f" style="animation-delay:0.34s"/><rect class="seg" x="644.00" y="28" width="80.18" height="8" rx="2" fill="#afb8c1" style="animation-delay:0.46s"/><rect class="seg" x="726.18" y="28" width="34.65" height="8" rx="2" fill="#d0d7de" style="animation-delay:0.58s"/><rect class="seg" x="762.83" y="28" width="51.17" height="8" rx="2" fill="#eaeef2" style="animation-delay:0.70s"/></g>
<g class="r" style="animation-delay:0.60s"><circle cx="29" cy="70" r="4" fill="#24292f" stroke="#d0d7de"/><text x="40" y="74" class="mute" font-size="12">swift  36.8%</text></g><g class="r" style="animation-delay:0.68s"><circle cx="148.2" cy="70" r="4" fill="#57606a" stroke="#d0d7de"/><text x="159.2" y="74" class="mute" font-size="12">typescript  23.6%</text></g><g class="r" style="animation-delay:0.76s"><circle cx="300.4" cy="70" r="4" fill="#8c959f" stroke="#d0d7de"/><text x="311.4" y="74" class="mute" font-size="12">python  17.8%</text></g><g class="r" style="animation-delay:0.84s"><circle cx="426.2" cy="70" r="4" fill="#afb8c1" stroke="#d0d7de"/><text x="437.2" y="74" class="mute" font-size="12">javascript  10.4%</text></g><g class="r" style="animation-delay:0.92s"><circle cx="578.4" cy="70" r="4" fill="#d0d7de" stroke="#d0d7de"/><text x="589.4" y="74" class="mute" font-size="12">css  4.6%</text></g><g class="r" style="animation-delay:1.00s"><circle cx="677.8" cy="70" r="4" fill="#eaeef2" stroke="#d0d7de"/><text x="688.8" y="74" class="mute" font-size="12">other  6.7%</text></g>
</svg>