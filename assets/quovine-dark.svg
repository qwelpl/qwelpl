.f{opacity:0;animation:fade 1s ease forwards}

.edge{fill:none;stroke:#e6edf3;stroke-width:1.2;stroke-dasharray:1100;stroke-dashoffset:1100;opacity:.55;animation:draw 1.8s cubic-bezier(.6,0,.2,1) 0.15s forwards, fade-out 1.2s ease 2.05s forwards, e4 72s ease-in-out infinite}
